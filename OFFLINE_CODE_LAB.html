<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodewithHafiz Code Lab Offline</title><style>body{margin:0;background:#0b1110;color:#dce9e3;font:14px Arial}header{height:54px;background:#101918;border-bottom:1px solid #24332e;display:flex;align-items:center;padding:0 18px;gap:14px}b{color:#6ee7a8}.app{display:grid;grid-template-columns:240px 1fr;height:calc(100vh - 54px)}aside{background:#0d1513;border-right:1px solid #24332e;padding:14px}.file{display:block;width:100%;background:none;color:#c7d3ce;border:0;text-align:left;padding:9px;border-radius:6px;cursor:pointer}.file.active{background:#173328;color:#fff}.icon{display:inline-block;width:42px;color:#63e6a0;font-size:10px}.main{display:grid;grid-template-rows:1fr 180px;min-width:0}.editor{display:grid;grid-template-columns:45px 1fr;position:relative;min-height:0}.gutter{padding:14px 8px;text-align:right;color:#53635d;background:#0b1110;line-height:1.65;white-space:pre;overflow:hidden}.wrap{position:relative;min-width:0}.highlight,textarea{position:absolute;inset:0;margin:0;padding:14px;font:14px/1.65 Consolas,monospace;white-space:pre;overflow:auto;tab-size:4}.highlight{pointer-events:none}.kw{color:#65d7ff}.str{color:#f5c26b}.num{color:#b9f27c}.com{color:#70827a}textarea{resize:none;background:transparent;color:transparent;caret-color:#fff;border:0;outline:0;z-index:2}.bottom{border-top:1px solid #24332e;background:#0d1513;display:grid;grid-template-columns:1fr 1fr}.panel{padding:12px;overflow:auto}.preview{width:100%;height:100%;border:0;background:white}.actions{margin-left:auto;display:flex;gap:7px}.btn{background:#183b2c;color:#dff9eb;border:1px solid #2c664b;border-radius:6px;padding:7px 11px;cursor:pointer}.run{background:#1b9a5c;color:white;border-color:#35c77d}.out{white-space:pre-wrap;color:#b9c8c1;font:12px/1.6 Consolas,monospace}</style></head><body><header><b>CodewithHafiz</b><span>Code Lab — Offline</span><div class="actions"><button class="btn run" id="run">▶ Run</button><button class="btn" id="save">Download Project</button></div></header><div class="app"><aside><b>EXPLORER</b><div id="files"></div></aside><div class="main"><div class="editor"><div class="gutter" id="gutter"></div><div class="wrap"><pre class="highlight" id="hi"></pre><textarea id="ed" spellcheck="false"></textarea></div></div><div class="bottom"><div class="panel"><b>TERMINAL / OUTPUT</b><div class="out" id="out">Ready.</div></div><div class="panel"><b>PREVIEW</b><iframe class="preview" id="frame" sandbox="allow-scripts"></iframe></div></div></div></div><script>const files={};let cur=Object.keys(files)[0]||'main.py';const ed=document.getElementById('ed'),hi=document.getElementById('hi'),gut=document.getElementById('gutter'),list=document.getElementById('files'),out=document.getElementById('out');function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function render(){list.innerHTML=Object.keys(files).map(n=>'<button class="file '+(n===cur?'active':'')+'" data-n="'+n.replace(/"/g,'&quot;')+'"><span class="icon">'+(n.split('.').pop()||'TXT').toUpperCase()+'</span>'+n+'</button>').join('');ed.value=files[cur]||'';hi.innerHTML=esc(ed.value);gut.textContent=Array.from({length:Math.max(1,ed.value.split('\n').length)},(_,i)=>i+1).join('\n')}list.onclick=e=>{let b=e.target.closest('[data-n]');if(b){files[cur]=ed.value;cur=b.dataset.n;render()}};ed.oninput=()=>{files[cur]=ed.value;hi.innerHTML=esc(ed.value);gut.textContent=Array.from({length:Math.max(1,ed.value.split('\n').length)},(_,i)=>i+1).join('\n')};ed.onscroll=()=>{hi.scrollTop=ed.scrollTop;hi.scrollLeft=ed.scrollLeft;gut.scrollTop=ed.scrollTop};document.getElementById('run').onclick=()=>{files[cur]=ed.value;let e=cur.split('.').pop().toLowerCase(),c=ed.value;out.textContent='';if(['html','htm'].includes(e)){let css=files['style.css']||'',js=files['script.js']||'';document.getElementById('frame').srcdoc=c.includes('<html')?c:'<style>'+css+'</style>'+c+'<script>'+js.replace(/<\/script>/gi,'<\\/script>')+'<\/script>';out.textContent='HTML preview opened.'}else if(e==='js'){try{let a=[];let old=console.log;console.log=(...x)=>a.push(x.join(' '));new Function(c)();console.log=old;out.textContent=a.join('\n')||'JavaScript finished.'}catch(x){out.textContent='JavaScript Error: '+x.message}}else if(e==='py'){out.textContent='Offline Python runner: this download includes a lightweight Python practice runner for print(), variables, f-strings and simple range() loops. Full Python packages are not available without an embedded Python runtime.';let lines=c.split('\n');let vars={};for(let l of lines){let m=l.trim().match(/^([A-Za-z_]\w*)\s*=\s*["\'](.*)["\']$/);if(m)vars[m[1]]=m[2];let p=l.trim().match(/^print\((.*)\)$/);if(p)out.textContent+='\n'+p[1].replace(/["\']/g,'').replace(/\{(\w+)\}/g,(_,k)=>vars[k]||'')}}else out.textContent='No browser runtime is embedded for '+e+'. Edit/download this file instead.'};document.getElementById('save').onclick=()=>{const b=new Blob([JSON.stringify(files,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='CodewithHafiz-project.json';a.click();URL.revokeObjectURL(a.href)};render();</script></body></html>
